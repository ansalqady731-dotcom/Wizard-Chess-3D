name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK via Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Add Capacitor Android Platform
        run: |
          npm install --save @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npx cap init "Wizard Chess 3D" "com.wizardchess.sanctum" --web-dir "dist"
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wizard-chess-3d-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0
          name: "Wizard Chess 3D v1.0.0 (APK)"
          body: "Official Android APK release for Wizard Chess 3D. Download and install app-debug.apk directly onto your Android device."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
